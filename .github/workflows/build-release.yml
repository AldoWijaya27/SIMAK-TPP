name: Build and Release

on:
  push:
    tags:
      - 'v*'
# Batalkan run sebelumnya jika ada push baru ke main
# Hanya commit paling akhir yang akan selesai di-build
concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Determine Version
      id: version
      shell: bash
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
        else
          echo "VERSION=${{ github.ref_name }}-v${{ github.run_number }}" >> $GITHUB_ENV
        fi

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Executable
      run: |
        pyinstaller SIMAK-TPP.spec
      shell: cmd

    - name: Copy files folder to dist
      run: |
        if (Test-Path "dist\SIMAK-TPP\files") { Remove-Item -Recurse -Force "dist\SIMAK-TPP\files" }
        Copy-Item -Path "files" -Destination "dist\SIMAK-TPP\files" -Recurse
      shell: pwsh

    - name: Zip Build Output
      run: |
        Compress-Archive -Path dist\SIMAK-TPP\* -DestinationPath SIMAK-TPP-Windows-${{ env.VERSION }}.zip
      shell: pwsh

    - name: Create New Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.VERSION }}
        name: "SIMAK-TPP ${{ env.VERSION }}"
        body: |
          📦 Build otomatis dari commit terbaru.
          🌿 Ref: `${{ github.ref_name }}`
          🔨 Commit: `${{ github.sha }}`

          ### Changelog / Perubahan
          ${{ github.event.head_commit.message }}

          ### Cara Install
          1. Download file ZIP di bawah
          2. Ekstrak ke folder mana saja
          3. Jalankan `SIMAK-TPP.exe`

          > ⚠️ Semua file dalam folder ZIP harus tetap berada dalam satu folder yang sama dengan `SIMAK-TPP.exe`.
        files: SIMAK-TPP-Windows-${{ env.VERSION }}.zip
        draft: false
        prerelease: false
        make_latest: true
