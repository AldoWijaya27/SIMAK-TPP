name: Build and Release

on:
  push:
    tags:
      - 'v*'
# Batalkan run sebelumnya jika ada push baru ke main
# Hanya commit paling akhir yang akan selesai di-build
concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Determine Version
      id: version
      shell: bash
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
        else
          echo "VERSION=${{ github.ref_name }}-v${{ github.run_number }}" >> $GITHUB_ENV
        fi

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt

    - name: Install UPX
      shell: pwsh
      run: |
        $upxVersion = "4.2.4"
        $url = "https://github.com/upx/upx/releases/download/v${upxVersion}/upx-${upxVersion}-win64.zip"
        Invoke-WebRequest -Uri $url -OutFile upx.zip
        Expand-Archive upx.zip -DestinationPath upx_dir
        $upxPath = (Get-ChildItem -Path upx_dir -Recurse -Filter "upx.exe").DirectoryName
        echo $upxPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        Write-Host "UPX installed at: $upxPath"

    - name: Build Executable
      run: |
        pyinstaller SIMAK-TPP.spec
      shell: cmd

    - name: Remove Unnecessary Files from Build
      shell: pwsh
      run: |
        $distPath = "dist\SIMAK-TPP"
        $patterns = @('*.pyi', '*.pyc', 'test_*.pyd', '*test*.pyd')
        foreach ($p in $patterns) {
          Get-ChildItem -Path $distPath -Recurse -Filter $p -ErrorAction SilentlyContinue | Remove-Item -Force
        }
        Get-ChildItem -Path $distPath -Recurse -Directory -Filter "__pycache__" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        Write-Host "Cleanup selesai"

    - name: Zip Build Output
      run: |
        Compress-Archive -Path dist\SIMAK-TPP\* -DestinationPath SIMAK-TPP-Windows-${{ env.VERSION }}.zip
      shell: pwsh

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.VERSION }}
        name: "SIMAK-TPP ${{ env.VERSION }}"
        body: |
          📦 Build otomatis dari commit terbaru.
          🌿 Ref: `${{ github.ref_name }}`
          🔨 Commit: `${{ github.sha }}`

          ### Changelog / Perubahan
          ${{ github.event.head_commit.message }}

          ### Cara Install
          1. Download file ZIP di bawah
          2. Ekstrak ke folder mana saja
          3. Jalankan `SIMAK-TPP.exe`

          > ⚠️ Semua file dalam folder ZIP harus tetap berada dalam satu folder yang sama dengan `SIMAK-TPP.exe`.
        files: SIMAK-TPP-Windows-${{ env.VERSION }}.zip
        draft: false
        prerelease: false
        make_latest: true
